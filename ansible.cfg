# Ansible configuration.
# See <https://github.com/ansible/ansible/blob/devel/examples/ansible.cfg>.

[defaults]
callback_result_format = yaml
check_mode_markers = yes
display_failed_stderr = yes
fact_caching = jsonfile
fact_caching_timeout = 3600
force_handlers = yes
gathering = smart
interpreter_python = auto_silent
inventory = hosts.ini
show_task_path_on_failure = yes

# Ansible vault configuration
#vault_password_file = .ansible-vault-secret

# Do NOT change the following paths when you want to use the script included in
# the Ansible Boilerplate Collection!
collections_path = ansible_galaxy
fact_caching_connection = .cache
roles_path = ansible_galaxy/ansible_roles:roles

[colors]
changed = bright yellow
error = bright red
ok = bright green

[diff]
# Show the differences of changed files (and templates) only when "--diff" is
# given: always showing them can reveal secrets on the terminal and in logs.
# Tip: Set "always = True" to always show the differences.
always = False

[privilege_escalation]
become = True
# Don't ask for the "become" (sudo) password on each run: pass "-K" (or
# "--ask-become-pass") when it is required.
# Tip: Set "become_ask_pass = True" to always ask for the password.
become_ask_pass = False

[ssh_connection]
control_path = %(directory)s/%%C
pipelining = True
